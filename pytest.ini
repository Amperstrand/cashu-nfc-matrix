[pytest]
markers =
    soak: long repetition/timing runs (nightly / explicit dispatch only)
    payer: writes tokens to wallet HCE (nucula reader only, never ACR)
    flaky(reruns=2, reruns_delay=45): interference-tolerant reruns (bc-taploop ambient reads)
testpaths = suites
# hardware is double-gated: --hil (conftest) + explicit test selection
addopts = -m "not soak and not payer"
