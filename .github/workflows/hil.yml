# cashu NFC interop matrix — bench HIL (ai-legion labgrid lab)
#
# SECURITY (root-adjacent runner — read before editing triggers):
#   workflow_dispatch + schedule ONLY. NEVER add pull_request /
#   pull_request_target: fork PR code would execute on the bench host
#   (ccid-firmware-rs #183 doctrine, same runner fleet).
#
# Runner: [self-hosted, bench] = ai-legion-bench-matrix on ai-legion.
# Suites flock /tmp/amperstrand-bench.lock BEFORE labgrid acquire (AB-BA)
# and skip loudly when another lane holds a place.

name: hil-nfc-matrix

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'smoke | full | payment | soak | virtual-soak'
        required: false
        default: 'full'
      soak_cycles:
        description: 'cycles when stage=soak or stage=virtual-soak'
        required: false
        default: '60'
  schedule:
    - cron: '37 1 * * *'   # disjoint from nucula fuzz (03:23) + hil (03:23)
    # SESSION K: monthly virtual-soak evidence regeneration. 20:23 UTC on
    # the 11th — hours off the 01:37 daily and 03:23 lanes (worst observed
    # 01:37 tail ~6h15m ends ~07:52) so the single bench runner never
    # queues behind them; vpcd-slot contention degrades to graceful skip.
    - cron: '23 20 11 * *'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  ADB_SERVER_SOCKET: 'tcp:127.0.0.1:5037'

jobs:
  hil:
    runs-on: [self-hosted, bench]
    name: NFC wallet matrix
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: bench inventory (coordinator view)
        run: |
          set +e
          labgrid-client -x ai-legion:20408 places > hil-places.txt 2>&1
          echo "rc=$?" >> hil-places.txt
          cat hil-places.txt
          exit 0

      - name: tier-driven run (smoke=core, full=core+extended) via matrixctl
        if: inputs.stage == 'smoke' || inputs.stage == 'full'
        run: |
          TIER=core
          [ "${{ inputs.stage }}" = "full" ] && TIER=all
          /usr/bin/python3 -m matrixctl plan --tier "$TIER" --out /tmp/plan.json
          /usr/bin/python3 -m matrixctl run /tmp/plan.json --dry-run
          # suites stay the executor for now: cells map onto pytest marks;
          # geometry gating skips cells whose bench facts say no.
          if [ "$( /usr/bin/python3 -c 'import json;print(len(json.load(open("/tmp/plan.json"))["runnable"]))' )" = "0" ]; then
            echo "plan: 0 cells runnable under current bench facts — smoke = survey only (green by design)"
            echo '<testsuite name="matrix-smoke" tests="1"><testcase classname="matrix" name="survey-only"/></testsuite>' > hil-junit.xml
            exit 0
          fi
          MARK="not soak and not payer"
          [ "$TIER" = "core" ] && MARK="not soak and not payer and not extended"
          /usr/bin/python3 -m pytest suites/ -v --hil
            --junitxml=hil-junit.xml --timeout=900 --timeout-method=signal
            -m "$MARK"

      - name: matrixctl survey + next (bench-state as CI input)
        run: |
          /usr/bin/python3 -m matrixctl survey || true
          cat bench-state.yaml || true
          /usr/bin/python3 -m matrixctl next || true
      - name: release stale labgrid holds (killed-run leak class)
        run: |
          for p in phone-s20 nucula-c3 ref-acr1252 m5stick; do
            labgrid-client -p $p release >/dev/null 2>&1 || true
          done
      - name: run payment round-trip (T5 e2e)
        if: inputs.stage == 'payment'
        run: |
          bash bench/wifi_check.sh
          /usr/bin/python3 -m pytest suites/test_t5_payment_roundtrip.py -v --hil \
            --junitxml=hil-junit.xml --timeout=900 --timeout-method=signal -m payer

      - name: run soak
        if: inputs.stage == 'soak'
        run: >
          /usr/bin/python3 -m pytest suites/test_t3_soak.py -v --hil
          --soak-cycles "${{ inputs.soak_cycles || '60' }}"
          --junitxml=hil-junit.xml --timeout=7200 --timeout-method=signal
          -m soak

      # SESSION K: substitution-mode soak on demand + monthly. Zero silicon:
      # fresh vpicc model per cycle on the pcscd vpcd slot, no labgrid
      # places, no ACR/phone (bench/vpicc/README.md). Slot absent or port
      # busy => graceful skip (rc=0), never disturbs the pcscd domain.
      - name: run virtual soak (substitution mode, vpcd slot only)
        if: inputs.stage == 'virtual-soak' || github.event.schedule == '23 20 11 * *'
        timeout-minutes: 20
        run: |
          set +e
          /usr/bin/python3 bench/tap_soak.py --virtual \
            --cycles "${{ inputs.soak_cycles || '100' }}" \
            --out results/virtual-soak.jsonl
          rc=$?
          # junit-wrap per cycle (soak-stage shape): JSONL rows become
          # testcases so a red cycle is visible in the hil-junit artifact;
          # the JSONL itself rides the evidence artifact via results/.
          /usr/bin/python3 - "$rc" results/virtual-soak.jsonl <<'PY'
          import json, sys
          from xml.sax.saxutils import quoteattr
          rc = int(sys.argv[1])
          rows = []
          try:
              rows = [json.loads(l) for l in open(sys.argv[2]) if l.strip()]
          except FileNotFoundError:
              pass
          cases = []
          for r in rows:
              name = f"cycle-{r.get('cycle')}-amount-{r.get('amount')}"
              if r.get("ok"):
                  cases.append(f'<testcase classname="virtual-soak" name={quoteattr(name)}/>')
              else:
                  err = (r.get("read_error") or r.get("arm_error")
                         or r.get("read_error_class") or r.get("arm_error_class")
                         or "fail")
                  cases.append(f'<testcase classname="virtual-soak" name={quoteattr(name)}>'
                               f'<failure message={quoteattr(str(err))}/></testcase>')
          if not rows and rc == 0:
              cases.append('<testcase classname="virtual-soak" name="graceful-skip"/>')
          with open("hil-junit.xml", "w") as fh:
              fh.write('<testsuite name="virtual-soak" tests="%d">%s</testsuite>'
                       % (len(cases), "".join(cases)))
          print(f"junit-wrap: {len(cases)} cases (rc={rc}) -> hil-junit.xml")
          PY
          exit $rc

      # failure-is-visible check (SESSION K): an injected unparseable NDEF
      # must leave rc!=0 AND classify as read_error_class=tool (the
      # suites/test_t3v_virtual_soak.py pin, asserted at workflow level).
      - name: virtual soak bad-read visibility check (injected failure must be red)
        if: inputs.stage == 'virtual-soak' || github.event.schedule == '23 20 11 * *'
        timeout-minutes: 10
        run: |
          set +e
          /usr/bin/python3 bench/tap_soak.py --virtual --cycles 3 --inject-bad-read 1 \
            --out results/virtual-soak-inject.jsonl
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo '::error::injected bad read was HIDDEN (rc=0) — failure-visibility regression'
            exit 1
          fi
          /usr/bin/python3 - results/virtual-soak-inject.jsonl <<'PY'
          import json, sys
          rows = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          bad = [r for r in rows if r.get("injected") == "bad_ndef"]
          assert len(bad) == 1, rows
          assert bad[0].get("read_error_class") == "tool", bad[0]
          assert rows[0].get("ok") is True and rows[2].get("ok") is True, rows
          print("inject check: rc!=0, injected row classified tool, neighbors ok")
          PY

      - name: bench-state + plan artifacts (survey outputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-state
          path: |
            bench-state.yaml
            /tmp/plan.json
          if-no-files-found: ignore

      - name: junit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: hil-junit, path: hil-junit.xml }

      - name: evidence artifacts (probe dumps, soak rows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-evidence
          path: results/
          if-no-files-found: ignore

      - name: bench inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: hil-places, path: hil-places.txt, if-no-files-found: ignore }
